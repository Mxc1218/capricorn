<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><title>摩羯 · 调试台</title>
<style>
:root{--bg:#0b1220;--panel:#111a2c;--line:#22304a;--fg:#e6edf7;--fg2:#9fb0c9;
--green:#3ddc84;--red:#ff5f56;--amber:#ffc857;--blue:#5aa9ff;--violet:#b08cff;--grey:#7c8aa0;--teal:#2dd4bf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.6 ui-monospace,Consolas,monospace}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line)}
h1{font-size:13px;margin:0;font-weight:600}
button{background:var(--panel);color:var(--fg2);border:1px solid var(--line);border-radius:5px;padding:3px 9px;font:inherit;cursor:pointer}
button.on{color:var(--fg);border-color:#3a4d70;background:#16223a}
.tag{font-size:11px;color:var(--fg2);border:1px solid var(--line);padding:1px 6px;border-radius:4px}
main{display:grid;grid-template-columns:230px 1fr 400px;height:calc(100vh - 43px)}
.col{border-right:1px solid var(--line);overflow:auto;padding:9px}
.col:last-child{border-right:none}
.sec{font-size:11px;color:var(--fg2);letter-spacing:.08em;margin:10px 0 5px}
.sec:first-child{margin-top:0}
.item{padding:5px 7px;border:1px solid transparent;border-radius:5px;cursor:pointer;margin-bottom:3px}
.item:hover{background:var(--panel)}
.item.sel{background:var(--panel);border-color:var(--line)}
.ok{color:var(--green)} .bad{color:var(--red)} .warn{color:var(--amber)}
.meta{font-size:11px;color:var(--fg2)}
.fact{padding:4px 7px;border-left:3px solid var(--line);margin-bottom:4px;background:var(--panel);border-radius:0 4px 4px 0}
.k-host{border-color:var(--blue)} .k-vuln{border-color:var(--red)} .k-cred{border-color:var(--amber)}
.k-loot{border-color:var(--violet)} .k-flag{border-color:var(--green)} .k-note{border-color:var(--grey)}
.k-service{border-color:var(--teal)}
.fid{color:var(--fg2);font-size:11px;margin-right:5px}
.ev{padding:5px 7px;border-bottom:1px dashed var(--line)}
.ev pre{margin:3px 0 0;white-space:pre-wrap;word-break:break-all;color:var(--fg2);font-size:11px;max-height:150px;overflow:auto}
.live{border:1px solid var(--line);border-radius:6px;padding:7px;margin-bottom:7px;background:var(--panel)}
.pulse{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;background:var(--grey)}
.pulse.on{background:var(--green);animation:p 1.2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:4px 7px;border-radius:5px;font:inherit;margin-bottom:6px}
#canvas{width:100%;height:100%;background:
  radial-gradient(circle at 1px 1px, #1b2740 1px, transparent 0) 0 0/22px 22px}
.pane{display:none} .pane.on{display:block}
.legend{position:absolute;right:12px;bottom:10px;background:rgba(11,18,32,.9);border:1px solid var(--line);
border-radius:6px;padding:6px 9px;font-size:11px;color:var(--fg2)}
.chip{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.detail{border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--panel);margin-bottom:8px}
.detail h3{margin:0 0 4px;font-size:12px}

.filterbar{display:flex;gap:14px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:11px;color:var(--fg2)}
.filterbar select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;font:inherit}
.filterbar input[type=checkbox]{accent-color:#5aa9ff}
body.focusmode main{grid-template-columns:0 1fr 0}
body.focusmode main .col:first-child, body.focusmode main .col:last-child{display:none}
.card{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:10px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:12px;color:var(--fg2);font-weight:600}
.big{font-size:20px}
.pill{display:inline-block;background:#16223a;border:1px solid var(--line);border-radius:10px;padding:1px 8px;margin:2px 4px 2px 0}
</style></head><body>
<header>
  <h1>摩羯 · 调试台</h1>
  <div aria-label="视图"><button data-view="tree" class="on">推理树</button><button data-view="overview">总览</button><button data-view="current">当前方向</button><button data-view="full">全量推导图</button><button data-view="lanes">泳道</button><button data-view="board">黑板</button><button id="btnFocus" title="画布铺满窗口（Esc 退出）">画布专注</button></div>
  <span class="tag" id="status">连接中…</span>
  <span class="meta" id="stats"></span>
  <span class="meta" id="clock" style="margin-left:auto"></span>
</header>
<main>
  <div class="col">
    <div class="sec">实时执行者</div><div id="live"></div>
    <div class="sec">运行记录</div><div id="runs"></div>
  </div>
  <div class="col" style="position:relative;padding:0;overflow:hidden">
    <div class="filterbar" id="filterbar"><label>状态 <select id="f-status"><option value="all">全部</option><option value="active">在跑/待认领/失联</option><option value="done">已收敛</option><option value="failed">已失败</option><option value="merged">已合并</option></select></label><label><input type="checkbox" id="f-notes"> 隐藏工具说明</label><label>缩放 <select id="f-zoom"><option value="auto">自动</option><option value="0.8">80%</option><option value="1">100%</option><option value="1.25">125%</option></select></label></div><div class="pane on" id="pane-tree" style="width:100%;height:100%"><svg id="canvas"></svg></div><div class="pane" id="pane-overview" style="padding:10px"></div>
    <div class="pane" id="pane-lanes" style="padding:9px"></div>
    <div class="pane" id="pane-board" style="padding:9px"><input id="q" placeholder="过滤黑板…"><div id="board"></div></div>
    <div class="legend">
      <div><span class="chip" style="background:#5aa9ff"></span>事实</div>
      <div><span class="chip" style="background:#3ddc84"></span>任务已完成</div>
      <div><span class="chip" style="background:#ffc857"></span>任务进行中</div>
      <div><span class="chip" style="background:#ff5f56"></span>任务失败</div>
    </div>
  </div>
  <div class="col">
    <div class="sec">详情 <span class="meta" id="detailHint">点一个节点</span></div>
    <div id="detail"></div>
    <div class="sec">步骤 <span class="meta" id="traceHint"></span></div>
    <div id="trace"></div>
  </div>
</main>
<script>
// 页面出错不要变成一片黑：把错误写到画布和标题上
window.onerror = function(m, src, line){
  try{
    const c = document.getElementById('canvas');
    if(c) c.innerHTML = '<text x="20" y="40" fill="#ff5f56" font-size="12">JS 出错：' + (m||'') + ' （第 ' + line + ' 行）</text>';
    document.getElementById('status').textContent = '出错';
  }catch(e){}
};
let state = { runs: [], live: [], graph: {nodes:[],edges:[]}, board: [], selTask:null, selWork:null, view:'tree', sel:null, lastLanes: [], filter:{status:'all', hideNotes:false, zoom:'auto'} };

const fmt = s => s == null ? '-' : (s >= 1000 ? (s/1000).toFixed(1)+'k' : s);
const esc = s => String(s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const dur = s => { s = Math.max(0, Math.round(s)); return s < 60 ? s+'s' : (s<3600? Math.floor(s/60)+'m'+(s%60)+'s' : Math.floor(s/3600)+'h'+Math.floor(s%3600/60)+'m'); };
async function getJson(url){ try{ const r = await fetch(url); return await r.json(); }catch(e){ return null; } }

// ── 视图切换 ────────────────────────────────────────────────
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
  state.view = b.dataset.view; location.hash = state.view;
  document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('on', x === b));
  // current / full 复用同一个画布面板（pane-tree），否则切过去是空白
  const paneOf = {tree:'tree', current:'tree', full:'tree', overview:'overview', lanes:'lanes', board:'board'};
  ['tree','overview','lanes','board'].forEach(v => {
    const el = document.getElementById('pane-'+v); if(el) el.classList.toggle('on', v === paneOf[state.view]);
  });
  document.getElementById('filterbar').style.display = (state.view==='tree'||state.view==='current'||state.view==='full') ? 'flex' : 'none';
  renderView(true);
});
function renderView(force){
  if(state.view === 'overview') return renderOverview();
  if(state.view === 'lanes') return drawLanes(state.lastLanes||[]);
  if(state.view === 'board') return drawBoard();
  return drawTree(force);
}

// ── 左：实时 + 运行 ─────────────────────────────────────────
function renderLive(list){
  const el = document.getElementById('live');
  if(!list || !list.length){ el.innerHTML = '<div class="meta">(没有正在跑的)</div>'; return; }
  el.innerHTML = list.map(d => {
    const on = d.status === 'running';
    const tok = d.tokens ? (fmt(d.tokens.prompt)+' + '+fmt(d.tokens.completion)) : '-';
    return '<div class="live"><div><span class="pulse '+(on?'on':'')+'"></span><b>'+esc(d.worker)+'</b> <span class="meta">'+esc(d.status)+'</span></div>'
      + '<div class="meta">'+esc(d.task)+'</div>'
      + '<div class="meta">第 '+(d.step||0)+' 步 · '+esc(d.phase||'')+' · '+tok+'</div>'
      + (d.tool ? '<div class="meta">工具 '+esc(d.tool)+'</div>' : '') + '</div>';
  }).join('');
}
function renderRuns(runs){
  const el = document.getElementById('runs');
  if(!runs || !runs.length){ el.innerHTML = '<div class="meta">(没有记录)</div>'; return; }
  el.innerHTML = runs.map(r => (r.tasks||[]).map(t =>
    '<div class="item '+(state.selTask===t.task?'sel':'')+'" data-task="'+esc(t.task)+'" data-work="'+esc(t.work)+'">'
    + '<div><span class="'+(t.solved?'ok':'bad')+'">'+(t.solved?'✓':'✗')+'</span> '+esc(t.task)+'</div>'
    + '<div class="meta">'+fmt(t.elapsed_s)+'s · '+fmt(t.tokens)+' tok · '+(t.steps||0)+' 步</div></div>').join('')
  ).join('');
  el.querySelectorAll('.item').forEach(n => n.onclick = () => {
    state.selTask = n.dataset.task; state.selWork = n.dataset.work;
    renderRuns(state.runs); refresh();
  });
}

// ── 中：推理树（分层布局）───────────────────────────────────
// ─────────────────────────────────────────────────────────────
// M4：视图齐全 —— 总览 / 当前方向 / 全量推导图 / 画布专注 + 筛选器
// ─────────────────────────────────────────────────────────────
function visibleNodes(){
  const f = state.filter;
  let nodes = state.graph.nodes || [];
  if(f.hideNotes) nodes = nodes.filter(n => !(n.type==='fact' && n.kind==='note'));
  if(f.status !== 'all'){
    nodes = nodes.filter(n => {
      if(n.type !== 'task') return true;          // 事实不按任务状态筛
      const st = (n.view && n.view.state) || n.status;
      if(f.status === 'active') return st==='running' || st==='pending' || st==='stalled';
      return st === f.status;
    });
  }
  const ids = new Set(nodes.map(n => n.id));
  const edges = (state.graph.edges||[]).filter(e => ids.has(e.from) && ids.has(e.to));
  return { nodes, edges };
}

function focusedNodes(){
  // 当前方向：只留"活着"的任务 + 它们的上下游一圈
  const keep = new Set();
  const all = state.graph.nodes || [];
  const byId = {}; all.forEach(n => byId[n.id] = n);
  all.forEach(n => {
    if(n.type!=='task') return;
    const st = (n.view && n.view.state) || n.status;
    if(!(st==='running' || st==='pending' || st==='stalled')) return;
    keep.add(n.id);
    (n.from_facts||[]).forEach(f => keep.add(f));
    (n.produced||[]).forEach(f => keep.add(f));
    state.graph.edges.forEach(e => { if(e.to===n.id) keep.add(e.from); if(e.from===n.id) keep.add(e.to); });
  });
  const nodes = all.filter(n => keep.has(n.id));
  const ids = new Set(nodes.map(n=>n.id));
  return { nodes, edges: (state.graph.edges||[]).filter(e => ids.has(e.from) && ids.has(e.to)) };
}

function renderOverview(){
  const el = document.getElementById('pane-overview');
  const g = state.graph, nodes = g.nodes||[], edges = g.edges||[];
  const tasks = nodes.filter(n=>n.type==='task'), facts = nodes.filter(n=>n.type==='fact');
  const byState = {}, byKind = {}, byEvidence = {};
  tasks.forEach(t => { const s=(t.view&&t.view.label)||t.status||'?'; byState[s]=(byState[s]||0)+1; });
  facts.forEach(f => { byKind[f.kind||'?']=(byKind[f.kind||'?']||0)+1;
                       byEvidence[f.evidence_status||'unverified']=(byEvidence[f.evidence_status||'unverified']||0)+1; });
  const rows = (obj) => Object.keys(obj).sort((a,b)=>obj[b]-obj[a]).map(k=>'<span class="pill">'+esc(k)+' '+obj[k]+'</span>').join(' ');
  const stuck = tasks.filter(t => t.view && (t.view.state==='stalled'));
  const running = tasks.filter(t => t.view && t.view.state==='running');
  el.innerHTML =
    '<div class="card"><h3>规模</h3>'
    + '<div class="big">'+tasks.length+' <span class="meta">任务</span> · '+facts.length+' <span class="meta">事实</span> · '+edges.length+' <span class="meta">边</span></div>'
    + '</div>'
    + '<div class="card"><h3>任务状态</h3><div>'+(rows(byState)||'<span class="meta">(空)</span>')+'</div></div>'
    + '<div class="card"><h3>事实类型</h3><div>'+(rows(byKind)||'<span class="meta">(空)</span>')+'</div></div>'
    + '<div class="card"><h3>证据等级</h3><div>'+(rows(byEvidence)||'<span class="meta">(空)</span>')+'</div></div>'
    + '<div class="card"><h3>需要盯的</h3>'
    + (running.length ? '<div class="meta">在跑：'+running.map(t=>esc(t.id)+' '+esc(t.title)+'（'+fmtDur((t.view.run||0))+'）').join('；')+'</div>' : '<div class="meta">没有在跑的任务</div>')
    + (stuck.length ? '<div style="color:#ff5f56">失联：'+stuck.map(t=>esc(t.id)+' '+esc(t.title)).join('；')+'</div>' : '')
    + '</div>';
}

let nodeEls = {};          // id -> {badge, rect, meta}
let graphKey = "";         // 内容指纹：只有内容变了才重建 SVG
let graphStamp = 0;        // 上次收到数据的时间，计时器据此增量累加

function graphSignature(g){
  // 只把"会影响几何"的东西算进指纹；计时是每分钟在变的，不能算进来，
  // 否则每秒都全量重绘 —— 旧前端那个 reasoningContentKey 就是在做这件事。
  const n = (g.nodes||[]).map(x => x.id + ':' + (x.type==='task' ? (x.view&&x.view.state) : (x.kind||'')) + ':' + (x.type==='task'? x.title : '')).join('|');
  const e = (g.edges||[]).map(x => x.from+'>'+x.to+':'+x.kind).join('|');
  return n + '#' + e;
}

function fmtDur(s){ s = Math.max(0, Math.round(s)); return s < 60 ? s+'s' : (s<3600 ? Math.floor(s/60)+'m'+(s%60)+'s' : Math.floor(s/3600)+'h'+Math.floor(s%3600/60)+'m'); }

function drawTree(force){
  const svg = document.getElementById('canvas');
  // 按当前视图挑要画的子图：tree/current/full 三种都用同一套渲染
  const g = state.view === 'current' ? focusedNodes()
          : (state.view === 'tree' || state.view === 'full') ? visibleNodes()
          : state.graph;
  if(state.view === 'full') { g.nodes = (g.nodes||[]).slice().sort((a,b)=>((a.ts||a.created||0)-(b.ts||b.created||0))); }
  const sig = graphSignature(g);
  if(!force && sig === graphKey){ updateTimers(); return; }   // ← 增量：不动 DOM
  graphKey = sig; graphStamp = Date.now(); nodeEls = {};

  const box = svg.getBoundingClientRect();
  const W = Math.max(600, box.width || 800), H = Math.max(400, box.height || 600);
  svg.setAttribute('viewBox', '0 0 '+W+' '+H);
  while(svg.firstChild) svg.removeChild(svg.firstChild);

  if(!g.nodes.length){
    var dbg = 'view='+state.view+' nodes='+(g.nodes||[]).length+' edges='+(g.edges||[]).length+' all='+(state.graph.nodes||[]).length+' err='+(state.lastErr||'');svg.innerHTML = '<text x="20" y="40" fill="#7c8aa0" font-size="12">（没有数据：' + dbg + '）</text>';
    return;
  }

  // ── 泳道：每条链一行。链的归属 = 它最早的祖先（根事实）────────────
  const byId = {}; g.nodes.forEach(n => byId[n.id] = n);
  const preds = {}; g.nodes.forEach(n => preds[n.id] = []);
  g.edges.forEach(e => { if(preds[e.to]) preds[e.to].push(e.from); });
  const depth = {}, root = {};
  function resolve(id, guard){
    if(depth[id] != null) return;
    if(guard.has(id)){ depth[id] = 0; root[id] = id; return; }
    guard.add(id);
    const ps = (preds[id]||[]).filter(p => byId[p]);
    if(!ps.length){ depth[id] = 0; root[id] = id; guard.delete(id); return; }
    ps.forEach(p => resolve(p, guard));
    depth[id] = Math.max(...ps.map(p => depth[p] || 0)) + 1;
    root[id] = ps.map(p => root[p]).sort()[0];
    guard.delete(id);
  }
  g.nodes.forEach(n => resolve(n.id, new Set()));

  const lanes = {};
  g.nodes.forEach(n => { const k = root[n.id] || n.id; (lanes[k] = lanes[k] || []).push(n); });
  const laneKeys = Object.keys(lanes).sort((a,b) => (byId[a]?.ts || 0) - (byId[b]?.ts || 0));

  const maxDepth = Math.max(1, ...Object.values(depth));
  const NW = 186, NH_TASK = 40, NH_FACT = 24, GAP_X = 46, GAP_Y = 10;
  const colW = NW + GAP_X;
  const needW = 26 + (maxDepth + 1) * colW;
  const W2 = Math.max(W, needW);
  svg.setAttribute("viewBox", "0 0 " + W2 + " " + H);

  // 泳道内按「层」堆叠：同一层放不下就往下一行，避免节点互相压住
  const pos = {};
  let yCursor = 16;
  laneKeys.forEach((k) => {
    const list = lanes[k].slice().sort((a,b) => (depth[a.id]-depth[b.id]) || ((a.ts||a.created||0)-(b.ts||b.created||0)));
    const stack = {};
    let laneBottom = yCursor;
    list.forEach((n) => {
      const d = depth[n.id] || 0;
      const idx = stack[d] = (stack[d] || 0) + 1;
      const y = yCursor + (idx - 1) * (NH_TASK + GAP_Y + 4);
      pos[n.id] = { x: 26 + d * colW, y: y };
      laneBottom = Math.max(laneBottom, y + NH_TASK + 6);
    });
    yCursor = laneBottom + 18;
  });

  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = '<marker id="arw" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#3a4d70"/></marker>';
  svg.appendChild(defs);


  // 边
  g.edges.forEach(e => {
    const a = pos[e.from], b = pos[e.to];
    if(!a || !b) return;
    const color = e.kind === 'produce' ? '#b08cff' : (e.kind === 'support' ? '#3a4d70' : (e.kind === 'merge' ? '#7c8aa0' : '#ffc857'));
    const x1 = a.x + NW, y1 = a.y + 14, x2 = b.x, y2 = b.y + 14;
    const mid = (x1 + x2) / 2;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', 'M'+x1+','+y1+' C'+mid+','+y1+' '+mid+','+y2+' '+x2+','+y2);
    path.setAttribute('fill','none'); path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', e.kind==='support' ? 1 : 1.6);
    if(e.kind==='support') path.setAttribute('stroke-dasharray','3,3');
    path.setAttribute('opacity','0.7'); path.setAttribute('marker-end','url(#arw)');
    svg.appendChild(path);
  });

  // 节点
  const TONE = {green:'#3ddc84', red:'#ff5f56', amber:'#ffc857', blue:'#5aa9ff', violet:'#b08cff', grey:'#7c8aa0'};
  g.nodes.forEach(n => {
    const p = pos[n.id]; if(!p) return;
    const isTask = n.type === 'task';
    const color = isTask
      ? (TONE[(n.view && n.view.tone) || 'grey'] || '#7c8aa0')
      : ({host:'#5aa9ff',service:'#2dd4bf',vuln:'#ff5f56',cred:'#ffc857',loot:'#b08cff',flag:'#3ddc84'}[n.kind] || '#7c8aa0');
    const grp = document.createElementNS('http://www.w3.org/2000/svg','g');
    grp.setAttribute('cursor','pointer');
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x', p.x); rect.setAttribute('y', p.y);
    rect.setAttribute('width', NW); rect.setAttribute('height', isTask ? NH_TASK : NH_FACT); rect.setAttribute('rx', 4);
    rect.setAttribute('fill', '#131d31'); rect.setAttribute('stroke', color);
    rect.setAttribute('stroke-width', state.sel === n.id ? 2.2 : 1);
    if(n.view && n.view.state === 'merged') rect.setAttribute('opacity', '0.5');
    grp.appendChild(rect);

    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x', p.x + 7); label.setAttribute('y', p.y + 15);
    label.setAttribute('fill', '#e6edf7'); label.setAttribute('font-size', '10.5');
    const text = isTask ? ('T '+n.id+' '+n.title) : (n.id+' '+(n.content||''));
    label.textContent = text.length > 26 ? text.slice(0,25)+'…' : text;
    grp.appendChild(label);

    let badge = null;
    if(isTask && n.view){
      badge = document.createElementNS('http://www.w3.org/2000/svg','text');
      badge.setAttribute('x', p.x + 7); badge.setAttribute('y', p.y + 31);
      badge.setAttribute('fill', color); badge.setAttribute('font-size', '9.5');
      grp.appendChild(badge);
      nodeEls[n.id] = { badge, view: n.view, stamp: Date.now() };
    } else if(!isTask){
      const ev = document.createElementNS('http://www.w3.org/2000/svg','text');
      ev.setAttribute('x', p.x + NW - 46); ev.setAttribute('y', p.y + 15);
      ev.setAttribute('fill', TONE[{accepted:'green',candidate:'amber',rejected:'red',negated:'grey',unverified:'blue'}[n.evidence_status] || 'grey'] || '#7c8aa0');
      ev.setAttribute('font-size', '9');
      ev.textContent = n.evidence_status === 'unverified' ? '' : n.evidence_status;
      grp.appendChild(ev);
    }
    grp.onclick = () => { state.sel = n.id; renderDetail(n); drawTree(true); };
    svg.appendChild(grp);
  });
  updateTimers();
}

function updateTimers(){
  // 不重建 DOM，只改文字 —— 每秒跑一次也不心疼
  const now = Date.now();
  Object.keys(nodeEls).forEach(id => {
    const o = nodeEls[id], v = o.view; if(!v || !o.badge) return;
    const delta = (now - o.stamp) / 1000;      // 数据到手后过了多少秒
    let extra = '';
    if(v.state === 'running') extra = ' · 已跑 ' + fmtDur(v.run + delta);
    else if(v.state === 'pending') extra = ' · 已等 ' + fmtDur(v.wait + delta);
    else if(v.state === 'stalled') extra = ' · 失联 ' + fmtDur(v.stale_for + delta);
    else if(v.state === 'done') extra = ' · 用时 ' + fmtDur(v.total);
    o.badge.textContent = v.label + extra;
  });
}


function renderDetail(n){
  document.getElementById('detailHint').textContent = n.id;
  const TONE = {green:'#3ddc84', red:'#ff5f56', amber:'#ffc857', grey:'#7c8aa0', violet:'#b08cff', blue:'#5aa9ff'};
  const rows = [];
  if(n.type === 'task'){
    const v = n.view || {};
    rows.push('<div class="detail"><h3>'+esc(n.id)+' · 任务</h3>');
    rows.push('<div style="color:'+(TONE[v.tone]||'#9fb0c9')+';margin:2px 0 6px">'+esc(v.label||n.status)+'</div>');
    rows.push('<div>'+esc(n.title)+'</div>');
    rows.push('<div class="meta" style="margin-top:4px">'+esc(n.detail||'')+'</div>');
    rows.push('<div class="meta" style="margin-top:6px">等 '+dur(v.wait||0)+' · 跑 '+dur(v.run||0)+' · 共 '+dur(v.total||0)+(n.worker?' · 执行者 '+esc(n.worker):'')+'</div>');
    rows.push('<div class="meta">依据 '+((n.from_facts||[]).map(f=>'<a href="#" data-goto="'+esc(f)+'">'+esc(f)+'</a>').join(' ')||'(无)'));
    rows.push(' → 产出 '+((n.produced||[]).map(f=>'<a href="#" data-goto="'+esc(f)+'">'+esc(f)+'</a>').join(' ')||'(无)')+'</div>');
    if(n.merged_into) rows.push('<div class="meta">已合并到 <a href="#" data-goto="'+esc(n.merged_into)+'">'+esc(n.merged_into)+'</a></div>');
    if(n.result) rows.push('<div class="meta" style="margin-top:6px;color:#9fb0c9">结论：'+esc(n.result)+'</div>');
  } else {
    const evc = {accepted:'#3ddc84',candidate:'#ffc857',rejected:'#ff5f56',negated:'#7c8aa0',unverified:'#5aa9ff'}[n.evidence_status]||'#7c8aa0';
    rows.push('<div class="detail"><h3>'+esc(n.id)+' · 事实</h3>');
    rows.push('<div class="meta">类型 '+esc(n.kind)+' · 证据 <span style="color:'+evc+'">'+esc(n.evidence_status||'unverified')+'</span></div>');
    rows.push('<div style="margin-top:4px">'+esc(n.content)+'</div>');
    rows.push('<div class="meta" style="margin-top:6px">产出者 '+(n.produced_by?'<a href="#" data-goto="'+esc(n.produced_by)+'">'+esc(n.produced_by)+'</a>':'(无)')+'</div>');
    if((n.refs||[]).length) rows.push('<div class="meta">依据 '+(n.refs||[]).map(f=>'<a href="#" data-goto="'+esc(f)+'">'+esc(f)+'</a>').join(' ')+'</div>');
  }
  rows.push('</div>');
  const el = document.getElementById('detail');
  el.innerHTML = rows.join('');
  el.querySelectorAll('[data-goto]').forEach(a => a.onclick = (ev) => {
    ev.preventDefault();
    const target = (state.graph.nodes||[]).find(x => x.id === a.dataset.goto);
    if(target){ state.sel = target.id; renderDetail(target); drawTree(true); }
  });
}


// ── 中：泳道 ────────────────────────────────────────────────
function drawLanes(lanes){
  const el = document.getElementById('pane-lanes');
  if(!lanes || !lanes.length){ el.innerHTML = '<div class="meta">(没有事件)</div>'; return; }
  const rowH = 30, blockW = 24, maxSteps = Math.max(1, ...lanes.map(l => Math.max(...l.events.filter(e=>e.kind==='tool').map(e=>e.step||1), 1)));
  let svg = '<svg width="100%" height="'+(lanes.length*rowH+10)+'" viewBox="0 0 '+(maxSteps*blockW+20)+' '+(lanes.length*rowH+10)+'">';
  lanes.forEach((lane,i) => {
    const y = i*rowH + 5;
    lane.events.filter(e=>e.kind==='tool').forEach(e => {
      const x = ((e.step||1)-1)*blockW;
      const fill = e.risk==='exec' ? '#ffc857' : (e.risk==='write' ? '#b08cff' : '#5aa9ff');
      svg += '<rect x="'+x+'" y="'+y+'" width="'+(blockW-3)+'" height="16" rx="3" fill="'+fill+'" opacity="0.85"><title>第'+e.step+'步 '+esc(e.name)+'</title></rect>';
    });
  });
  svg += '</svg>';
  el.innerHTML = svg;
}

// ── 中：黑板 ────────────────────────────────────────────────
function drawBoard(){
  const q = document.getElementById('q').value.toLowerCase();
  const facts = state.board.filter(f => !q || JSON.stringify(f).toLowerCase().includes(q));
  document.getElementById('board').innerHTML = facts.map(f =>
    '<div class="fact k-'+(f.kind||'note')+'"><span class="fid">'+esc(f.id)+'</span>'
    + '<span class="meta">['+esc(f.kind)+']</span> '+esc(f.content)
    + (f.produced_by ? ' <span class="meta">⊂'+esc(f.produced_by)+'</span>' : '')
    + ((f.refs||[]).length ? ' <span class="meta">←'+esc(f.refs.join(','))+'</span>' : '')
    + '</div>').join('') || '<div class="meta">(空)</div>';
}

// ── 右：步骤 ────────────────────────────────────────────────
function renderTrace(lanes){
  const el = document.getElementById('trace');
  document.getElementById('traceHint').textContent = state.selTask || '';
  if(!lanes || !lanes.length){ el.innerHTML = '<div class="meta">(没有事件)</div>'; return; }
  el.innerHTML = lanes.map((lane,i) => '<details style="margin-bottom:5px"><summary class="meta">泳道 '+(i+1)+' · '+esc(lane.name)+'</summary>'
    + lane.events.map(e => {
      if(e.kind === 'model'){
        const u2 = e.usage || {};
        return '<div class="ev"><div><b>第 '+e.step+' 步</b> <span class="meta">想 '+fmt(u2.reasoning)+' · 入 '+fmt(u2.prompt)+' · 出 '+fmt(u2.completion)+'</span></div>'
          + (e.reasoning ? '<pre>'+esc(e.reasoning.slice(0,400))+'</pre>' : '') + '</div>';
      }
      if(e.kind === 'tool'){
        return '<div class="ev"><div><span class="meta">第 '+e.step+' 步</span> <b class="warn">'+esc(e.name)+'</b></div>'
          + '<pre>'+esc(JSON.stringify(e.args||{}).slice(0,300))+'</pre>'
          + '<pre style="color:#7c8aa0">'+esc((e.observation||'').slice(0,300))+'</pre></div>';
      }
      return '';
    }).join('') + '</details>').join('');
}

async function refresh(){
  if(state.selTask){
    state.board = await getJson('/api/board?task='+encodeURIComponent(state.selTask)) || [];
    state.graph = await getJson('/api/graph?work='+encodeURIComponent(state.selWork)) || {nodes:[],edges:[]};
    const lanes = await getJson('/api/trace?work='+encodeURIComponent(state.selWork)) || [];
    state.lastLanes = lanes; renderTrace(lanes); drawLanes(lanes);
  }
  if(state.view === 'tree') drawTree();
  if(state.view === 'board') drawBoard();
}

async function tick(){
  state.live = await getJson('/api/live') || [];
  renderLive(state.live);
  state.runs = await getJson('/api/runs') || [];
  renderRuns(state.runs);
  if(!state.selTask && state.runs.length){
    let pick = null;
    // 优先选「有因果图」的那次：树视图才有东西可画
    for(const r of state.runs){ for(const t of (r.tasks||[])){ if(t.has_graph){ pick = t; break; } } if(pick) break; }
    if(!pick) for(const r of state.runs){ for(const t of (r.tasks||[])){ if(t.has_trace){ pick = t; break; } } if(pick) break; }
    if(!pick){ for(const r of state.runs){ const t=(r.tasks||[])[0]; if(t){ pick=t; break; } } }
    if(pick){ state.selTask = pick.task; state.selWork = pick.work; renderRuns(state.runs); }
  }
  await refresh();
  const g = state.graph;
  document.getElementById('stats').textContent = g.nodes.length ? (g.nodes.length+' 节点 / '+g.edges.length+' 边') : '';
  document.getElementById('status').textContent = '在线 · 2s';
  document.getElementById('clock').textContent = new Date().toLocaleTimeString();
}
// 启动时按 hash 恢复视图，例如 http://127.0.0.1:8770/#overview
const initial = (location.hash||'').replace('#','');
if(initial){ const btn = document.querySelector('[data-view="'+initial+'"]'); if(btn) setTimeout(()=>btn.click(), 50); }
document.getElementById('q').oninput = drawBoard;
document.getElementById('f-status').onchange = (e) => { state.filter.status = e.target.value; renderView(true); };
document.getElementById('f-notes').onchange = (e) => { state.filter.hideNotes = e.target.checked; renderView(true); };
document.getElementById('f-zoom').onchange = (e) => { state.filter.zoom = e.target.value; renderView(true); };

window.addEventListener('resize', () => renderView(false));
document.getElementById('btnFocus').onclick = () => {
  document.body.classList.toggle('focusmode');
  renderView(true);
};
window.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && document.body.classList.contains('focusmode')){ document.body.classList.remove('focusmode'); renderView(true); }
  if(e.key === 'f' || e.key === 'F'){ document.getElementById('btnFocus').click(); }
});
tick();
setInterval(tick, 2000);
setInterval(updateTimers, 1000);   // 计时器本地走字，不等服务器
</script></body></html>
